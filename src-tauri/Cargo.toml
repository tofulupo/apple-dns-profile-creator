[package]
name = "dns-profile-creator"
# No version: the app takes its version from deno.json (see tauri.conf.json).
description = "Creates encrypted DNS profiles for Apple devices"
license = "BSD-3-Clause"
edition = "2024"
publish = false

[lib]
# Distinct from the bin name: https://github.com/rust-lang/cargo/issues/8519
name = "dns_profile_creator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
plist = "1"
sha1_smol = "1"

# The share menu (src/share.rs), at the versions Tauri itself uses, and Keychain
# signing (src/signing.rs).
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
security-framework-sys = "2"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSArray",
  "NSGeometry",
  "NSString",
  "NSURL",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSResponder",
  "NSSharingService",
  "NSView",
] }

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
