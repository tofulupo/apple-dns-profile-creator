<button type="button" class="privacy-pill" id="privacyPill"
  popovertarget="privacyPanel" aria-label="Privacy: forget on close is on">
  <span class="icon icon--fingerprint" aria-hidden="true"></span>
  <span aria-hidden="true">Privacy</span>
</button>
<div class="privacy-panel" id="privacyPanel" popover>
  <label class="switch-row">
    <span class="switch-row__text">
      <span class="switch-row__hint" id="privacyHint">Deletes cards and
        settings. For zero traces, use a private window.</span>
    </span>
    <input type="checkbox" role="switch" class="switch" id="privacyChk" checked
      aria-label="Forget on close" aria-describedby="privacyHint">
  </label>
</div>
