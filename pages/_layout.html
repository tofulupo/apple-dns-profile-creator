<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }}</title>
    <meta name="description" content="{{ description }}">
    <link rel="canonical" href="{{ canonical }}">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="DNS Profile Creator">
    <meta property="og:title" content="{{ title }}">
    <meta property="og:description" content="{{ description }}">
    <meta property="og:url" content="{{ canonical }}">
    {{ structuredData }}
    <link rel="stylesheet" href="{{ stylesheet }}">
    <!-- The fonts every page shows (scripts/build.ts). Fonts are always
      requested in CORS mode, hence crossorigin even on the same origin. -->
    {{ fontPreloads }}

    <link rel="icon" type="image/png" sizes="96x96"
      href="icons/favicon-96x96.png" />
    <link rel="icon" type="image/svg+xml" href="icons/favicon.svg" />
    <link rel="shortcut icon" href="icons/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180"
      href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="DNS profile" />
    <link rel="manifest" href="site.webmanifest" />
    <meta name="theme-color" content="#f8fafc"
      media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0e1013"
      media="(prefers-color-scheme: dark)">
    <script>
    // Marks the desktop app, whose fonts differ (css/app.css). Tauri injects
    // __TAURI__ before any of the page's scripts run.
    if ("__TAURI__" in window) document.documentElement.dataset.app = "desktop";
    // Applies a chosen theme before first paint, so it never flashes the
    // other one. Key and values must match src/ui/storage.ts and theme.ts.
    try {
      const theme = localStorage.getItem("dns-mobileconfig:theme");
      if (theme === "light" || theme === "dark") {
        document.documentElement.dataset.theme = theme;
      }
    } catch {}
    </script>
  </head>

  <body>
    <div class="page">
      <header class="site-header">
        <div class="site-header__top">
          <div class="brand">
            <h1 class="brand__name">DNS Profile Creator</h1>
            <p class="brand__protocols">Encrypted DNS (DoH/DoT)</p>
          </div>
          <div class="site-header__actions">
            <button type="button" class="theme-switch" id="themeSwitch"
              aria-label="Theme">
              <span class="icon icon--theme" aria-hidden="true"></span>
            </button>
            <a class="version"
              href="https://github.com/tofulupo/apple-dns-profile-creator"
              target="_blank" rel="noopener"
              aria-label="v{{ version }}, source code on GitHub">v{{ version }}</a>
          </div>
        </div>

      </header>

      <nav class="tabs">
        {{ nav }}
      </nav>

      <main>
        {{ content }}
      </main>
    </div>
    {{ script }}
  </body>
</html>
