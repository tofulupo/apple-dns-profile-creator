<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <!-- viewport-fit=cover: css/app.css relies on env(safe-area-inset-*). -->
    <meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>{{ title }}</title>
    <meta name="description" content="{{ description }}">
    <link rel="canonical" href="{{ canonical }}">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="DNS Profile Creator">
    <meta property="og:title" content="{{ title }}">
    <meta property="og:description" content="{{ description }}">
    <meta property="og:url" content="{{ canonical }}">
    {{ structuredData }}
    <link rel="stylesheet" href="{{ stylesheet }}">
    {{ fontPreloads }}

    <link rel="icon" type="image/png" sizes="96x96"
      href="icons/favicon-96x96.png" />
    <link rel="icon" type="image/svg+xml" href="icons/favicon.svg" />
    <link rel="shortcut icon" href="icons/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180"
      href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="DNS profile" />
    <link rel="manifest" href="site.webmanifest" />
    <meta name="theme-color" content="#f8fafc"
      media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0e1013"
      media="(prefers-color-scheme: dark)">
    {{ prepaint }}
  </head>

  <body>
    <div class="titlebar" data-tauri-drag-region aria-hidden="true"></div>
    <div class="page">
      <header class="site-header">
        <div class="brand">
          {{ mascot }}
          <h1 class="brand__name">DNS Profile Creator</h1>
          <p class="brand__protocols">Encrypted DNS (DoH/DoT)</p>
        </div>
      </header>

      <div class="dock">
        <nav class="tabs" aria-label="Pages">
          {{ nav }}
        </nav>
        <div class="site-header__actions">
          <button type="button" class="theme-switch" id="themeSwitch"
            aria-label="Theme">
            <span class="icon icon--theme" aria-hidden="true"></span>
          </button>
          <a class="version"
            href="https://github.com/tofulupo/apple-dns-profile-creator"
            target="_blank" rel="noopener"
            aria-label="v{{ version }}, source code on GitHub, opens in a new tab"><span
              class="icon icon--source" aria-hidden="true"></span>v{{ version }}</a>
        </div>
      </div>

      <main>
        {{ content }}
      </main>
    </div>
    {{ script }}
  </body>
</html>
