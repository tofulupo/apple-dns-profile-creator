name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so sitemap.xml gets each page's real last-change date
          # rather than the date of the shallow clone's only commit.
          fetch-depth: 0

      - uses: denoland/setup-deno@v2
        with:
          deno-version: ~2.9

      # Asset URLs are relative, so dist/ works unchanged under the
      # /<repository>/ subpath a project Pages site is served from.
      - run: deno task build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
