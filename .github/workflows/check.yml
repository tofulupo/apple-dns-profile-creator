name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          # Pinned to a minor: deno bundle is experimental.
          deno-version: ~2.9

      # For the desktop app in src-tauri/, which `deno task check` lints and
      # tests too.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Unlicensed upstream profiles, so they are not committed.
      - name: Fetch upstream fixtures
        continue-on-error: true
        run: deno task fixtures:fetch

      - run: deno task check

      - run: deno task build
