name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential file libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libwebkit2gtk-4.1-dev libxdo-dev webkit2gtk-driver xdotool \
            xvfb

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          # Pinned to a minor: deno bundle is experimental.
          deno-version: ~2.9

      # Pinned to a commit on the `stable` branch. The action reads the
      # toolchain from the ref name, so it has to be passed explicitly.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Cargo.lock matches Cargo.toml
        run: cargo fetch --locked --manifest-path src-tauri/Cargo.toml

      # Ignored advisories: .cargo/audit.toml, read from the repo root.
      - name: cargo audit
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --file src-tauri/Cargo.lock

      - name: Install tauri-driver
        if: runner.os == 'Linux'
        run: cargo install tauri-driver --version 2.1.0 --locked

      # Unlicensed upstream profiles, so they are not committed.
      - name: Fetch upstream fixtures
        continue-on-error: true
        run: deno task fixtures:fetch

      - run: deno task check

      - name: e2e tests
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum deno task test:e2e

      # Ubuntu 24.04's AppArmor blocks the user namespaces Chrome's sandbox needs,
      # and Chrome exits at start.
      - name: Allow Chrome's sandbox
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # The website in headless Chrome for Testing, which WebdriverIO downloads
      # with its chromedriver.
      - name: Browser tests
        if: runner.os == 'Linux'
        run: deno task test:browser

      - run: deno task build
