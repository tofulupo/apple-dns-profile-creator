name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          # Pinned to a minor: deno bundle is experimental.
          deno-version: ~2.9

      # Unlicensed upstream profiles, so they are not committed.
      - name: Fetch upstream fixtures
        continue-on-error: true
        run: deno task fixtures:fetch

      - run: deno task check

      - run: deno task build
